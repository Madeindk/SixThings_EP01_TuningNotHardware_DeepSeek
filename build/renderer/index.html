<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>6 Things EP01 renderer</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- F mode: 3D studio plate -->
  <div id="stageF" class="mode">
    <canvas id="gl"></canvas>
    <div id="vignette"></div>
    <div id="brackets"></div>
    <div id="panel" class="abs"></div>
    <div id="caption" class="abs"></div>
  </div>

  <!-- E mode: editorial paper -->
  <div id="stageE" class="mode">
    <div id="counter" class="abs"></div>
    <div id="display" class="abs"></div>
    <div id="quadcut" class="abs"></div>
    <div id="label" class="abs"></div>
    <div id="mini" class="abs"></div>
    <div id="eBody" class="abs"></div>
  </div>

  <div id="wipe" class="abs"></div>
  <script type="module" src="main.js"></script>
</body>
</html>
